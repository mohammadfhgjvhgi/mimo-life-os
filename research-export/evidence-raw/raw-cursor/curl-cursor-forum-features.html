        <script type="application/json" id="data-preloaded">{"topic_7204":"{\"post_stream\":{\"posts\":[{\"id\":15107,\"name\":\"Bora\",\"username\":\"commander\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/c/df705f/{size}.png\",\"created_at\":\"2024-08-07T19:01:17.144Z\",\"cooked\":\"\\u003col\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIf I describe what I want to do to the cursor, can it write me code?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIf I upload the code I generated with ChatGPT / Claude to Cursor, can Cursor see and fix errors?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":2,\"updated_at\":\"2024-08-07T19:01:17.144Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":7837,\"reads\":92,\"readers_count\":91,\"score\":39183.4,\"yours\":false,\"topic_id\":7204,\"topic_slug\":\"understanding-cursors-ai-feature\",\"display_username\":\"Bora\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":3145,\"hidden\":false,\"trust_level\":0,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/understanding-cursors-ai-feature/7204/1\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":15110,\"name\":\"\",\"username\":\"litecode\",\"avatar_template\":\"/user_avatar/forum.cursor.com/litecode/{size}/2966_2.png\",\"created_at\":\"2024-08-07T19:42:40.163Z\",\"cooked\":\"\\u003cp\\u003eHi \\u003ca class=\\\"mention\\\" href=\\\"/u/commander\\\"\\u003e@commander\\u003c/a\\u003e ,\\u003c/p\\u003e\\n\\u003cp\\u003eIn response to your questions - yes and yes.\\u003c/p\\u003e\\n\\u003cp\\u003eBelow is some  more detail.\\u003c/p\\u003e\\n\\u003cp\\u003eCursor is a fork of VS Code.\\u003c/p\\u003e\\n\\u003cp\\u003eVS Code is a Code Editor by Microsoft:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://code.visualstudio.com/\\\"\\u003ehttps://code.visualstudio.com/\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe company who created Cursor are Anysphere:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://anysphere.inc/\\\"\\u003ehttps://anysphere.inc/\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAnysphere received some funding from OpenAI, the company behind Chat GPT:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://anysphere.inc/blog/openai-fund\\\"\\u003ehttps://anysphere.inc/blog/openai-fund\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eUpdate - they recently raised some more funds:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.cursor.com/blog/series-a\\\"\\u003ehttps://www.cursor.com/blog/series-a\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eCursor’s official Features page is here:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.cursor.com/features\\\"\\u003ehttps://www.cursor.com/features\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eCursor’s official Docs are here:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://docs.cursor.com\\\"\\u003ehttps://docs.cursor.com\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe docs are also on GitHub:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://github.com/getcursor/docs\\\"\\u003ehttps://github.com/getcursor/docs\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eCursor includes built in AI functionality.\\u003c/p\\u003e\\n\\u003cp\\u003eThis functionality is accessed in several ways.\\u003c/p\\u003e\\n\\u003cp\\u003eWhen you have a file open in Cursor, you can press one of several different key combinations to access different functionality.\\u003c/p\\u003e\\n\\u003cp\\u003eThese are:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003eCtrl\\u003c/code\\u003e + \\u003ccode\\u003eK\\u003c/code\\u003e for in-file code generation\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003eCtrl\\u003c/code\\u003e + \\u003ccode\\u003eL\\u003c/code\\u003e to open up an AI chat panel in the sidebar\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003eCtrl\\u003c/code\\u003e + \\u003ccode\\u003eI\\u003c/code\\u003e to create and edit code across multiple files\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eYou can select two different ‘modes’ in \\u003ccode\\u003eCtrl\\u003c/code\\u003e + \\u003ccode\\u003eL\\u003c/code\\u003e:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eNormal\\u003c/li\\u003e\\n\\u003cli\\u003eInterpreter\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eInterpreter mode generates executable Python code that can be run on your local file system.\\u003c/p\\u003e\\n\\u003cp\\u003eYou can also press \\u003ccode\\u003eCtrl\\u003c/code\\u003e + \\u003ccode\\u003eK\\u003c/code\\u003e in the terminal within Cursor to generate terminal commands from natural language prompts.\\u003c/p\\u003e\\n\\u003cp\\u003eI only found Cursor three weeks ago myself, but have been a fan ever since.\\u003c/p\\u003e\\n\\u003cp\\u003eI have created some other posts which try to outline Cursor’s features to newcomers:\\u003c/p\\u003e\\n\\u003caside class=\\\"quote quote-modified\\\" data-post=\\\"1\\\" data-topic=\\\"6476\\\"\\u003e\\n  \\u003cdiv class=\\\"title\\\"\\u003e\\n    \\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex020/user_avatar/forum.cursor.com/litecode/48/2966_2.png\\\" class=\\\"avatar\\\"\\u003e\\n    \\u003ca href=\\\"https://forum.cursor.com/t/cursor-feature-summary-for-colleagues-with-annotated-screenshots/6476\\\"\\u003eCursor feature summary for colleagues (with annotated screenshots)\\u003c/a\\u003e \\u003ca class=\\\"badge-category__wrapper \\\" href=\\\"/c/general/4\\\"\\u003e\\u003cspan data-category-id=\\\"4\\\" style=\\\"--category-badge-color: #25AAE2; --category-badge-text-color: #FFFFFF;\\\" data-drop-close=\\\"true\\\" class=\\\"badge-category \\\" title=\\\"Create topics here that don’t fit into any other existing category.\\\"\\u003e\\u003cspan class=\\\"badge-category__name\\\"\\u003eGeneral\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Hello, \\nI just thought I would share some text and annotated screenshots I have recently used when telling colleagues about Cursor. \\nI find documenting things is a good way to learn them quickly. \\nI only started using Cursor last weekend, and I normally use Sublime Text, so it is all very new to me at the moment. \\nBut I thought I would share these resources in case it saves you some time when telling your colleagues about it. \\nThe official ‘features’ page is here: \\n\\u003ca href=\\\"https://www.cursor.com/features\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://www.cursor.com/feature…\\u003c/a\\u003e\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003caside class=\\\"quote quote-modified\\\" data-post=\\\"1\\\" data-topic=\\\"6604\\\"\\u003e\\n  \\u003cdiv class=\\\"title\\\"\\u003e\\n    \\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex020/user_avatar/forum.cursor.com/litecode/48/2966_2.png\\\" class=\\\"avatar\\\"\\u003e\\n    \\u003ca href=\\\"https://forum.cursor.com/t/comprehensive-and-succinct-list-of-cursor-features/6604\\\"\\u003eComprehensive and Succinct List of Cursor Features\\u003c/a\\u003e \\u003ca class=\\\"badge-category__wrapper \\\" href=\\\"/c/general/4\\\"\\u003e\\u003cspan data-category-id=\\\"4\\\" style=\\\"--category-badge-color: #25AAE2; --category-badge-text-color: #FFFFFF;\\\" data-drop-close=\\\"true\\\" class=\\\"badge-category \\\" title=\\\"Create topics here that don’t fit into any other existing category.\\\"\\u003e\\u003cspan class=\\\"badge-category__name\\\"\\u003eGeneral\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Hello, \\nI started using Cursor last weekend, and I was working on a Google Sheet of Cursor features for my own reference. \\nI thought my research might assist others learning how to use Cursor. \\nSo I published the Google Sheet as a web page, but that removed the sorting and filtering functionality. \\nSo I’ve created a GitHub Pages site that retains the sorting and filtering features: \\n\\u003ca href=\\\"https://litecodeai.github.io/cursorfeatures\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://litecodeai.github.io/cursorfeatures\\u003c/a\\u003e \\nI will keep adding to it over the coming weeks, make it more user fri…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003caside class=\\\"quote quote-modified\\\" data-post=\\\"5\\\" data-topic=\\\"7042\\\"\\u003e\\n  \\u003cdiv class=\\\"title\\\"\\u003e\\n    \\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex020/user_avatar/forum.cursor.com/litecode/48/2966_2.png\\\" class=\\\"avatar\\\"\\u003e\\n    \\u003ca href=\\\"https://forum.cursor.com/t/separate-the-visual-ui-inlay-hints-into-multiple-togglable-options/7042/5\\\"\\u003eSeparate the visual UI inlay hints into multiple togglable options\\u003c/a\\u003e \\u003ca class=\\\"badge-category__wrapper \\\" href=\\\"/c/feature-requests/5\\\"\\u003e\\u003cspan data-category-id=\\\"5\\\" style=\\\"--category-badge-color: #9EB83B; --category-badge-text-color: #FFFFFF;\\\" data-drop-close=\\\"true\\\" class=\\\"badge-category \\\"\\u003e\\u003cspan class=\\\"badge-category__name\\\"\\u003eFeature Requests\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Hi \\u003ca class=\\\"mention\\\" href=\\\"/u/ryunuck\\\"\\u003e@ryunuck\\u003c/a\\u003e, \\nI did this test when running Cursor 0.39.0: \\n\\n\\nConfirmed that Show chat/edit tooltip setting was OFF \\n\\n\\nMade some edits to see if the various ‘Cursor Tab’ features were working \\n\\n\\nAttached are screenshots of: \\n\\n\\nThe Show chat/edit tooltip setting turned to OFF \\n\\n\\nVarious ‘Cursor Tab’ functionality still being present, ie: \\n\\nCode Generation\\nMulti-Line Edits\\nSmart Rewrites\\nCursor Prediction\\n\\n\\n\\nToolbar settings for ‘Cursor Tab’ in bottom-right of screen \\n\\n\\nI must admit, however, that…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003caside class=\\\"quote quote-modified\\\" data-post=\\\"24\\\" data-topic=\\\"6425\\\"\\u003e\\n  \\u003cdiv class=\\\"title\\\"\\u003e\\n    \\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex020/user_avatar/forum.cursor.com/litecode/48/2966_2.png\\\" class=\\\"avatar\\\"\\u003e\\n    \\u003ca href=\\\"https://forum.cursor.com/t/multi-file-edits-0-37-update/6425/24\\\"\\u003eMulti-file edits - 0.37 update\\u003c/a\\u003e \\u003ca class=\\\"badge-category__wrapper \\\" href=\\\"/c/feedback/7\\\"\\u003e\\u003cspan data-category-id=\\\"7\\\" style=\\\"--category-badge-color: #0E76BD; --category-badge-text-color: #FFFFFF;\\\" data-drop-close=\\\"true\\\" class=\\\"badge-category \\\"\\u003e\\u003cspan class=\\\"badge-category__name\\\"\\u003eFeedback\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    \\u003ca class=\\\"mention\\\" href=\\\"/u/smaccoun\\\"\\u003e@smaccoun\\u003c/a\\u003e \\nHere is a simple demonstration of what is possible in Composer, in case you were still wondering. \\nI entered this prompt in Composer: \\n\\nI want to demonstrate the multiple file editing capabilities of the new Composer feature in Cursor (the fork of VS Code). \\nPlese create a folder called ‘TestHTMLSite’ that contains an index.html file and css and js folders that contain the code required to create a simple HTML website. \\nAdd any simple JS functionality that you think would be cool. \\nTh…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eHere are some videos about Cursor as well:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.youtube.com/watch?v=YALpX8oOn78\\\"\\u003eALL ROADS LEAD to AI CODING: Cursor, Aider in the browser, Multi file Prompting\\u003c/a\\u003e\\u003cbr\\u003e\\n(20 mins, IndyDevDan)\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.youtube.com/watch?v=ltBYp0Ddi3c\\\"\\u003eCursor - an AI-powered VSCode fork\\u003c/a\\u003e\\u003cbr\\u003e\\n(12 mins, Jeffrey Codes)\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.youtube.com/watch?v=HZCtOh_GVrA\\\"\\u003eCursor IDE deep dive and why it is the best tool for coding\\u003c/a\\u003e\\u003cbr\\u003e\\n(26 mins, echohive)\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.youtube.com/watch?v=1V4ryI2vN_I\\\"\\u003eCursor - The AI-first Code Editor\\u003c/a\\u003e\\u003cbr\\u003e\\n(8 mins, AI Tube)\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.youtube.com/watch?v=r3BSULZNWBI\\\"\\u003eHow to use Interpreter Mode and Terminal Commands in Cursor\\u003c/a\\u003e\\u003cbr\\u003e\\n(5 mins, echohive)\\u003c/p\\u003e\\n\\u003cp\\u003eI am away from the computer at the moment, but hopefully this explanation and these posts and videos will give you a good idea of what Cursor is capable of.\\u003c/p\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":2,\"updated_at\":\"2024-08-31T05:06:39.964Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":403,\"reads\":92,\"readers_count\":91,\"score\":2033.4,\"yours\":false,\"topic_id\":7204,\"topic_slug\":\"understanding-cursors-ai-feature\",\"display_username\":\"\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":7,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://www.cursor.com/features\",\"internal\":false,\"reflection\":false,\"title\":\"Features | Cursor - The AI-first Code Editor\",\"clicks\":120},{\"url\":\"https://docs.cursor.com\",\"internal\":false,\"reflection\":false,\"title\":\"Cursor - Build Software Faster\",\"clicks\":94},{\"url\":\"https://anysphere.inc/\",\"internal\":false,\"reflection\":false,\"title\":\"Anysphere\",\"clicks\":48},{\"url\":\"https://www.youtube.com/watch?v=YALpX8oOn78\",\"internal\":false,\"reflection\":false,\"clicks\":36},{\"url\":\"https://github.com/getcursor/docs\",\"internal\":false,\"reflection\":false,\"title\":\"GitHub - getcursor/docs: Cursor's Open Source Documentation\",\"clicks\":33},{\"url\":\"https://code.visualstudio.com/\",\"internal\":false,\"reflection\":false,\"title\":\"Visual Studio Code - Code Editing. Redefined\",\"clicks\":30},{\"url\":\"https://anysphere.inc/blog/openai-fund\",\"internal\":false,\"reflection\":false,\"title\":\"We raised $8M from OpenAI.\",\"clicks\":24},{\"url\":\"https://www.cursor.com/blog/series-a\",\"internal\":false,\"reflection\":false,\"title\":\"We R             <div class='post' itemprop="text">
              <p>Hi <a class="mention" href="/u/commander">@commander</a> ,</p>
<p>In response to your questions - yes and yes.</p>
<p>Below is some  more detail.</p>
<p>Cursor is a fork of VS Code.</p>
<p>VS Code is a Code Editor by Microsoft:</p>
<p><a href="https://code.visualstudio.com/">https://code.visualstudio.com/</a></p>
<p>The company who created Cursor are Anysphere:</p>
<p><a href="https://anysphere.inc/">https://anysphere.inc/</a></p>
<p>Anysphere received some funding from OpenAI, the company behind Chat GPT:</p>
<p><a href="https://anysphere.inc/blog/openai-fund">https://anysphere.inc/blog/openai-fund</a></p>
<p>Update - they recently raised some more funds:</p>
<p><a href="https://www.cursor.com/blog/series-a">https://www.cursor.com/blog/series-a</a></p>
<p>Cursor’s official Features page is here:</p>
<p><a href="https://www.cursor.com/features">https://www.cursor.com/features</a></p>
<p>Cursor’s official Docs are here:</p>
<p><a href="https://docs.cursor.com">https://docs.cursor.com</a></p>
<p>The docs are also on GitHub:</p>
<p><a href="https://github.com/getcursor/docs">https://github.com/getcursor/docs</a></p>
<p>Cursor includes built in AI functionality.</p>
<p>This functionality is accessed in several ways.</p>
<p>When you have a file open in Cursor, you can press one of several different key combinations to access different functionality.</p>
<p>These are:</p>
<ol>
<li><code>Ctrl</code> + <code>K</code> for in-file code generation</li>
<li><code>Ctrl</code> + <code>L</code> to open up an AI chat panel in the sidebar</li>
<li><code>Ctrl</code> + <code>I</code> to create and edit code across multiple files</li>
</ol>
<p>You can select two different ‘modes’ in <code>Ctrl</code> + <code>L</code>:</p>
<ul>
<li>Normal</li>
<li>Interpreter</li>
</ul>
<p>Interpreter mode generates executable Python code that can be run on your local file system.</p>
<p>You can also press <code>Ctrl</code> + <code>K</code> in the terminal within Cursor to generate terminal commands from natural language prompts.</p>
<p>I only found Cursor three weeks ago myself, but have been a fan ever since.</p>
<p>I have created some other posts which try to outline Cursor’s features to newcomers:</p>
