MDWPND4G" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"post":{"id":"7ueTQdwolLe99HbwEMLKGm","slug":"building-deep-dive-infrastructure-for-ai-agents-that-actually-go-deep","title":"Building Deep Dive: Infrastructure for AI Agents That Actually Go Deep","description":"https://www.youtube.com/embed/mDwg9N2WAmM?feature=oembed When we started noticing patterns in our agent logs back in May 2025, something caught our attention....","body":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"https://www.youtube.com/embed/mDwg9N2WAmM?feature=oembed","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"When we started noticing patterns in our agent logs back in May 2025, something caught our attention. Users were asking agents for comprehensive, multi-step tasks, expecting depth, but they were getting surface-level answers or context window errors instead. More interesting: the agents were trying to help, spontaneously inventing filesystem-like syntax to navigate data they couldn't actually access properly.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"That observation kicked off the Deep Dive project. Not because deep research is trendy (though OpenAI, Anthropic, and Google all launched their versions this year), but because we saw a fundamental gap between what agents needed to do real work and what infrastructure existed to support them.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"The problem: depth requires different infrastructure","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Quick answers are easy. An agent can search your docs, find relevant chunks, and synthesize a response in seconds. But comprehensive work requires something fundamentally different.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Think about how you tackle a complex investigation spanning multiple systems. You don't just search once and synthesize. You explore different angles. You follow leads from internal docs to your data warehouse to external sources. You identify gaps, dig deeper, change direction based on what you find. You work for hours, not seconds.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Traditional agents fail at this because they're built on infrastructure designed for speed, not depth. Semantic search works brilliantly for finding known information, but it breaks down when you need to explore structure, navigate relationships, or conduct multi-step investigations across different systems.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We realized that to build an agent that could truly go deep across all your data (proprietary company sources, data warehouses, the web, custom integrations), we needed to solve seven infrastructure problems that nobody else was addressing together.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"1. Data Source File System: teaching agents to navigate","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"In April 2025, we noticed agents in our logs were spontaneously creating syntax like ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"file:front/src/some-file-name.tsx","nodeType":"text"},{"data":{},"marks":[],"value":" and ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"path:/notion/engineering/weekly-updates","nodeType":"text"},{"data":{},"marks":[],"value":". They were trying to reference resources by inventing file paths, even though no filesystem existed.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This was a hint. Agents weren't just searching for meaning. They were trying to navigate structure. When you need \"the TeamOS section of last week's team meeting notes,\" you're not searching semantically. You know there's a meetings database, you know there are weekly entries, you know where to look.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We built synthetic filesystems that map disparate data sources (Slack channels, Notion databases, GitHub repos, Google Sheets) into navigable Unix-like structures. Five simple commands: ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"list","nodeType":"text"},{"data":{},"marks":[],"value":", ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"find","nodeType":"text"},{"data":{},"marks":[],"value":", ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"cat","nodeType":"text"},{"data":{},"marks":[],"value":", ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"search","nodeType":"text"},{"data":{},"marks":[],"value":", ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"locate_in_tree","nodeType":"text"},{"data":{},"marks":[],"value":". Just like Unix, but operating across your entire company knowledge base.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The breakthrough wasn't the filesystem itself. It was recognizing that agents need both navigation and search. Navigation builds contextual understanding. Search finds specific information within that context. Together, they mirror how humans actually work with information.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Read more about it ","nodeType":"text"},{"data":{"uri":"blog/how-we-taught-ai-agents-to-navigate-company-data-like-a-filesystem/"},"content":[{"data":{},"marks":[],"value":"here","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"2. Warehouses: structured data at scale","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Most custom agents operate on narrow scopes: a handful of documents, maybe a specific Notion database. We needed the opposite. Deep Dive required access to everything, including the structured data living in your data warehouses.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Not just reading from databases. True exploration. An agent investigating business performance shouldn't be limited to documents about revenue. It should query Snowflake directly, join tables, analyze trends, then correlate findings with strategy docs and competitive intelligence from the web.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We built warehouse tools that let agents discover available tables (800+ tables, thousands of columns in some customer environments), understand their schemas, and write SQL queries on the fly. Combined with the filesystem tools, agents can now operate at unprecedented scope while maintaining the ability to go arbitrarily deep in any direction.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This combination is the key differentiator from traditional deep research tools. Most of them search the web. We connect to your entire data infrastructure. Large scope plus ability to go deep.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"3. Toolsets: dynamic discovery","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Every workspace has different needs. Some teams need Salesforce access. Others need GitHub. Others need custom internal APIs through MCP (Model Context Protocol).","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Traditional agents require manual configuration: you build an agent, you wire up its specific tools, you deploy it. But Deep Dive needed to be genuinely generic. It shouldn't care what tools exist in your workspace. ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"It should discover them, understand them, and use them as needed.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Toolsets solve this. When Deep Dive starts working, it queries available toolsets in the workspace, discovers what tools are available, and incorporates them dynamically. No manual setup. No per-workspace customization.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This makes Deep Dive fundamentally adaptable. As you add new data sources, new MCP servers, new integrations, Deep Dive automatically gains those capabilities. It's the closest we've come to a truly general-purpose work agent.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"4. Sub-agent coordination: expanding context and compute","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Here's where the architecture gets interesting. Complex work isn't a single linear process. It's parallel exploration across multiple angles, each requiring focused attention and its own context.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The fundamental challenge: context windows are finite. Even with 200K token limits, a comprehensive investigation can't fit everything in one conversation. Sub-agents solve this by giving each sub-problem its own dedicated context window.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Explore our ","nodeType":"text"},{"data":{"uri":"https://dust.tt/share/frame/baef9daa-a84f-432e-a532-4d4b071fbaf0"},"content":[{"data":{},"marks":[],"value":"Frame","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" to see how it works.","nodeType":"text"}],"nodeType":"paragraph"},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"751ge4ljeqso"}},"id":"31A6pGR0qxPhtSinJJL6H2","type":"Asset","createdAt":"2025-12-03T13:24:27.246Z","updatedAt":"2025-12-03T13:24:27.246Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":2,"revision":1,"locale":"en-US"},"fields":{"title":"Building Deep Dive: Infrastructure for AI Agents That Actually Go Deep - image-2.png","description":"Migrated from https://blog.dust.tt/content/images/2025/10/image-2.png","file":{"url":"//images.ctfassets.net/751ge4ljeqso/31A6pGR0qxPhtSinJJL6H2/66cda9fa1ea56aa15141daa738e67651/image-2.png","details":{"size":143474,"image":{"width":2000,"height":892}},"fileName":"image-2.png","contentType":"image/png"}}}},"content":[]},{"data":{},"content":[{"data":{},"marks":[],"value":"We built Deep Dive as a three-agent system:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"@deep-dive","nodeType":"text"},{"data":{},"marks":[],"value":" acts as the coordinator. It classifies request complexity, decomposes tasks into atomic subtasks, and orchestrates up to 6 concurrent sub-agents using parallel tool calling. Think of it as a project lead delegating focused work streams to specialists.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"@dust-planning","nodeType":"text"},{"data":{},"marks":[],"value":" is the strategic reviewer. When tasks are complex enough, the main agent consults the planning agent to validate its approach. The planning agent has no data access (deliberately), forcing it to provide high-level strategic guidance rather than prescriptive details based on potentially outdated knowledge. It runs with maximum reasoning effort, dedicating substantial compute to thinking through the strategic decomposition before responding.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"@dust-task","nodeType":"text"},{"data":{},"marks":[],"value":" agents are the specialized workers. Each receives a focused prompt, executes independently with full access to data tools, and produces information-dense reports optimized for agent consumption rather than human formatting. Crucially, each sub-agent gets its own fresh context window, meaning it can browse dozens of pages, query multiple databases, and explore company data without competing for space with other parallel investigations.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"This architecture fundamentally expands what's possible. Instead of one agent with one context window trying to do everything, you get multiple agents working in parallel, each with dedicated context for their specific sub-problem.","nodeType":"text"},{"data":{},"marks":[],"value":" This enables investigations requiring 10-30+ minutes of execution while maintaining quality at each step. The system is built on Temporal workflows for durability, meaning work can survive deployments and infrastructure issues without losing progress.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The result: longer time horizons, massively more compute deployed on the problem, and the ability to tackle truly comprehensive tasks that would be impossible within a single context window.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"5. Native reasoning: keeping the thread","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"The rise of reasoning models (OpenAI's o1/o3 and now GPT-5, Anthropic's extended thinking, DeepSeek R1) opened up new possibilities for Deep Dive. These models don't just answer questions. They think through problems systematically, exploring approaches, evaluating trade-offs, and building coherent plans before acting.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"For Deep Dive, this matters enormously. When coordinating 10-30+ minutes of research across multiple sub-agents, maintaining coherence becomes challenging. The agent needs to remember what it has already investigated, why it chose certain directions, what hypotheses it is testing, and how new findings connect to earlier discoveries.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Reasoning models excel at this. Their extended thinking maintains strategic coherence across dozens of tool calls. They're better at decomposing complex tasks into logical subtasks. They recognize when they need to adjust their research plan based on what they've learned. In practice, we see dramatically better planning and more coherent final synthesis when using reasoning models for complex investigations.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"The integration challenge:","nodeType":"text"},{"data":{},"marks":[],"value":" Supporting native reasoning required significant changes to our infrastructure. We previously used \"ad-hoc\" reasoning with delimiter-based approaches (XML tags marking thinking blocks). Native reasoning uses the models' built-in capabilities, where reasoning is managed through structured responses.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The key challenge was re-thinking our internal data model to support these new APIs and enable passing intermediate reasoning steps back to the model at each step. Without this, models \"reason again from scratch\" at every tool call, losing the thread of their previous thinking.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The result is that Deep Dive (and of course, all Dust agents) can now run with reasoning models from multiple providers. The models maintain strategic coherence across long sessions. Users can select effort levels (short, medium, long) to control how much reasoning budget to allocate. For complex investigations requiring careful planning and synthesis, native reasoning makes the difference between scattered findings and coherent research. And because we built the infrastructure to support native reasoning as a first-class capability, new reasoning models work out of the box.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"6. Context engineering: finite windows, infinite work","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Long-running investigations face a fundamental constraint: context windows are finite, and comprehensive work hits walls quickly. A few large web pages, some database query results, several documents - suddenly you're out of space, and the agent starts forgetting what it learned earlier.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We built two complementary systems to solve this.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Tool output pruning: preserving the thread","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"The core problem: when agents perform complex multi-step work with parallel tool calls and large outputs, they overflow their context window. Our previous approach was crude - drop entire message pairs when space ran out. The agent would lose all memory of previous work, causing what we called \"The Amnesia.\"","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Explore our ","nodeType":"text"},{"data":{"uri":"https://dust.tt/share/frame/ea5cefd2-fecd-402f-9135-32fe3a63601b"},"content":[{"data":{},"marks":[],"value":"Frame","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" to see how it works ","nodeType":"text"}],"nodeType":"paragraph"},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"751ge4ljeqso"}},"id":"4GT5cwbvB0UOZTP3YK62EA","type":"Asset","createdAt":"2025-12-03T13:24:33.680Z","updatedAt":"2025-12-03T13:24:33.680Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":2,"revision":1,"locale":"en-US"},"fields":{"title":"Building Deep Dive: Infrastructure for AI Agents That Actually Go Deep - image-3.png","description":"Migrated from https://blog.dust.tt/content/images/2025/10/image-3.png","file":{"url":"//images.ctfassets.net/751ge4ljeqso/4GT5cwbvB0UOZTP3YK62EA/68f66613ce9430cbca83ce9642334791/image-3.png","details":{"size":115018,"image":{"width":2068,"height":842}},"fileName":"image-3.png","contentType":"image/png"}}}},"content":[]},{"data":{},"content":[{"data":{},"marks":[],"value":"Tool output pruning takes a smarter approach. Instead of dropping entire interactions, we selectively prune tool outputs by replacing their content with ","nodeType":"text"},{"data":{},"marks":[{"type":"code"}],"value":"\u003cdust_system\u003eThis tool output is no longer available\u003c/dust_system\u003e","nodeType":"text"},{"data":{},"marks":[],"value":". The tool call itself remains visible, so the model still sees what it did, just not the full results.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We use two pruning strategies:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Current interaction pruning","nodeType":"text"},{"data":{},"marks":[],"value":" handles the \"Big Loop\" problem - when the current task generates so many tool calls that even the active interaction won't fit. We progressively prune the earliest tool outputs until everything fits.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Historical interaction pruning","nodeType":"text"},{"data":{},"marks":[],"value":" solves \"The Amnesia\" - removing tool outputs from past interactions when running out of context. The agent can still see what it previously produced (like a long report it just wrote), but intermediate tool results from earlier interactions are pruned to make room.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This maintains reasoning continuity, and also allows the user to follow up without the agent forgetting about the document it just wrote.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"Offloaded tool use: taming noisy outputs","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Tool outputs can be massive and noisy. Web pages arrive with navigation menus, ads, and formatting artifacts. Warehouse queries return thousands of rows. A single tool call can consume 200k+ tokens, leaving no room for anything else.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Explore our ","nodeType":"text"},{"data":{"uri":"https://dust.tt/share/frame/5356591f-3daa-467f-8fa9-50e4e3a153af"},"content":[{"data":{},"marks":[],"value":"Frame","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" to see how it works ","nodeType":"text"}],"nodeType":"paragraph"},{"nodeType":"embedded-asset-block","data":{"target":{"metadata":{"tags":[],"concepts":[]},"sys":{"space":{"sys":{"type":"Link","linkType":"Space","id":"751ge4ljeqso"}},"id":"5rJACp9qMK9JS7V0sgS5Yv","type":"Asset","createdAt":"2025-12-03T13:24:40.206Z","updatedAt":"2025-12-03T13:24:40.206Z","environment":{"sys":{"id":"master","type":"Link","linkType":"Environment"}},"publishedVersion":2,"revision":1,"locale":"en-US"},"fields":{"title":"Building Deep Dive: Infrastructure for AI Agents That Actually Go Deep - image-4.png","description":"Migrated from https://blog.dust.tt/content/images/2025/10/image-4.png","file":{"url":"//images.ctfassets.net/751ge4ljeqso/5rJACp9qMK9JS7V0sgS5Yv/a340e0e75194b3da63870ca904107296/image-4.png","details":{"size":130491,"image":{"width":2000,"height":868}},"fileName":"image-4.png","contentType":"image/png"}}}},"content":[]},{"data":{},"content":[{"data":{},"marks":[],"value":"Offloaded tool use solves this by treating large tool outputs as files rather than inline content. When some tools produce substantial output, we:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Store the full result as a file attachment","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Generate a compact representation (a few lines for CSVs, an AI-generated summary for web pages)","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Present only the compact version in the agent's context","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"ordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"The agent sees the snippet by default, but gains full filesystem access to the underlying data. It can read the entire file, search through it using semantic search, apply regex patterns to filter content, or paginate through specific sections using offset and limit parameters.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This transforms how agents work with data. Instead of drowning in a 30,000-token web page, the agent sees a reasonable summary and can strategically decide what to examine in detail. Instead of processing 5,000 rows of query results inline, it sees the first 10 rows and schema, then searches or filters as needed.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The result: agents can invoke dozens of data-heavy tools without overwhelming their context. Web browsing becomes practical at scale. Warehouse queries can return full result sets that agents explore interactively rather than trying to fit everything in context upfront.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"The result: 10-30+ minute investigations","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Together, these techniques fundamentally change what's possible. Deep Dive can now run investigations requiring hundreds of tool calls, browsing many web pages, querying multiple databases, and exploring extensive company data - all while maintaining coherence across the entire session.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The system is built to be pragmatic. We chose tool output pruning over compression schemes because it's simple, effective, fast, and handles the vast majority of cases. When combined with offloaded browsing and sub-agent coordination (where each sub-agent gets its own fresh context), we've created an infrastructure that genuinely supports depth.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This is what enables 10-30+ minute work sessions. Not just longer timeouts, but proper context engineering that lets agents go deep without losing the thread.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"7. Handoff: composable depth","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Once we built Deep Dive, we faced an interesting challenge. We had this powerful agent that could coordinate sub-agents, query warehouses, and navigate complex data structures. But how could we make it available as a capability for other agents?","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"More specifically: how could @dust (our general-purpose assistant) leverage Deep Dive's research capabilities when needed? How could customers build custom agents that, when faced with complex questions, could delegate to Deep Dive while maintaining their own domain-specific context?","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The answer was handoff.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Handoff is conceptually different from the sub-agent coordination we use internally in Deep Dive. When Deep Dive spawns @dust-task sub-agents, they run in background conversations and return results. ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"Handoff is about transferring control: one agent recognizes it needs longer-horizon work and hands the entire conversation over to Deep Dive.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"How it works:","nodeType":"text"},{"data":{},"marks":[],"value":" The calling agent invokes a \"Go Deep\" tool. Instead of spawning a background conversation, this creates a new agent message in the same conversation. Deep Dive takes over and responds directly to the user.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"We also maintain instruction awareness. When an agent hands off to Deep Dive, we automatically pass the calling agent's instructions along. Deep Dive receives the calling agent's full prompt, so it understands the specialized context of the agent that called it.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This means Deep Dive understands what the calling agent was trying to do. A customer support agent might have instructions about how to handle support queries, escalation protocols, and company-specific policies. When it hands off to Deep Dive for complex research, Deep Dive receives all that context and can provide research that respects those constraints.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"The result:","nodeType":"text"},{"data":{},"marks":[],"value":" Every agent can now leverage Deep Dive's infrastructure. @dust has the Go Deep tool enabled by default. Custom agents built by customers can add it through the agent builder. Domain-specific agents maintain their specialization while gaining access to comprehensive research capabilities when needed.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"cta":null,"tags":["Product"],"image":{"url":"https://images.ctfassets.net/751ge4ljeqso/4CCPWIWP1K4dvhV2tlO4bD/1f6956467a6a1d0d60db8bd684e718b0/image.png","alt":"Building Deep Dive","width":2000,"height":1120},"authors":[],"createdAt":"2025-10-29T16:40:27.000Z","updatedAt":"2025-12-03T13:24:40.910Z","isSeoArticle":false,"isGeoArticle":false,"isThoughtLeadership":false},"relatedPosts":[{"id":"2NyezjqjmkgGCkWn7FwQih","slug":"introducing-self-improving-skills-reusable-ai-capabilities","title":"Introducing self-improving skills: reusable AI capabilities that learn from usage","description":"Skills are one of the best ways to scale expertise across digital teams of humans and agents. They contain sets of instructions that encode various team...","tags":["Product"],"image":{"url":"https://images.ctfassets.net/751ge4ljeqso/36YfWArSPq2vgWapLNO3Dt/1883b633aa39004b47962aef9495ab63/Suggestions.jpg","alt":"self-improving skills","width":4000,"height":2240},"createdAt":"2026-07-07T13:51:29.887Z","isSeoArticle":false,"isGeoArticle":false,"isThoughtLeadership":false},{"id":"5lAyh9p4xIybT4kEJiZIa8","slug":"your-agent-lives-in-your-inbox","title":"AI x Email: Your Agent Lives in Your Inbox","description":"Dust recently shipped a feature that lets you loop any Dust agent into an email thread — just like you'd loop in a colleague. Forward a message to...","tags":["Product"],"image":{"url":"https://images.ctfassets.net/751ge4ljeqso/Gc0kkzx033JWsGeA7OD5f/54e4efbe4999aee83135d804f3c4f166/Your_Agent_Lives_in_Your_Inbox.jpg","alt":"Your Agent Lives in Your Inbox","width":4000,"height":2240},"createdAt":"2026-05-28T13:42:24.535Z","isSeoArticle":false,"isGeoArticle":false,"isThoughtLeadership":true},{"id":"1X5aeBavX2LWEr5UeZKPvz","slug":"build-a-flock-not-a-crowd","title":"Build a Flock, Not a Crowd","description":"The average person at Dust uses over 15 different agents in a week. Each one built by someone who understood a problem: the sales team's way of qualifying...","tags":["Product"],"image":{"url":"https://images.ctfassets.net/751ge4ljeqso/1rPKN9WnrBIBUplKWgGQT6/e7b0946e66988542b76807ee8f26771f/Build_a_Flock__Not_a_Crowd_1.jpg","alt":"flock","width":4000,"height":2240},"createdAt":"2026-03-04T14:00:14.031Z","isSeoArticle":false,"isGeoArticle":false,"isThoughtLeadership":true}],"gtmTrackingId":"GTM-MDWPND4G","preview":false},"__N_SSG":true},"page":"/blog/[slug]","query":{"slug":"building-deep-dive-infrastructure-for-ai-agents-that-actually-go-deep"},"buildId":"nRJ4pBbRbVXzEAmduJxBo","isFallback":false,"isExperimentalCompile":false,"gsp":true,"scriptLoader":[]}</script></body></html>
